{% extends "liff/base.html" %}

{% block title %}設定 - MediAgent+{% endblock %}

{% block content %}
<header class="mb-3">
  <h1 class="h5 brand mb-0">設定</h1>
</header>

<div class="card shadow-sm border-0 mb-3">
  <div class="card-body">
    <div class="d-flex align-items-center justify-content-between">
      <div>
        <div class="text-secondary small">綁定狀態</div>
        <div class="fw-bold" id="status-text">—</div>
      </div>
      <span class="badge" id="status-badge"></span>
    </div>
    <p class="small text-secondary mt-2 mb-0" id="status-hint"></p>
  </div>
</div>

<div class="card shadow-sm border-0 mb-3 d-none" id="summary-card">
  <div class="card-body">
    <h2 class="h6 fw-bold">已填寫資料摘要</h2>
    <dl class="row small mb-0" id="summary"></dl>
  </div>
</div>

<div class="d-grid gap-2">
  <a class="btn btn-brand" href="/liff/intake" id="btn-intake">填寫基本資料</a>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
  var STATUS = {
    unbound: { label: "未填寫", badge: "text-bg-secondary", hint: "填寫基本資料並經院所核對後，即可使用個人化衛教與服藥提醒。" },
    pending: { label: "等待院所核對", badge: "text-bg-warning", hint: "資料已送出、目前唯讀，院所核對身份後會透過 LINE 通知您。" },
    verified: { label: "已驗證", badge: "text-bg-success", hint: "您可以使用所有個人化功能。資料為唯讀，需要修改請於就診時告知院所人員。" },
    locked: { label: "已鎖定", badge: "text-bg-danger", hint: "帳號因資料異常暫時鎖定，請於就診時向院所人員說明，由院方核對後解除。" }
  };
  var SUMMARY_KEYS = [["full_name", "姓名"], ["national_id", "身分證"], ["phone", "手機"], ["preferred_hospital_id", "就醫院所（已向院所確認）"]];

  LiffApp.boot(async function (ctx) {
    var status = STATUS[ctx.principal.binding_status] || STATUS.unbound;
    document.getElementById("status-text").textContent = status.label;
    document.getElementById("status-badge").className = "badge " + status.badge;
    document.getElementById("status-badge").textContent = ctx.principal.binding_status;
    document.getElementById("status-hint").textContent = status.hint;
    var btn = document.getElementById("btn-intake");
    if (ctx.principal.binding_status === "locked") btn.classList.add("disabled");
    if (ctx.principal.binding_status === "pending" || ctx.principal.binding_status === "verified") {
      btn.textContent = "檢視已送出的基本資料";
      btn.className = "btn btn-outline-secondary";
    }

    var state = await ctx.api("/api/v1/liff/intake");
    var data = Object.assign({}, state.data || {});
    if (data.preferred_hospital_id) {
      // 院所代碼換成名稱顯示
      var hospitals = await ctx.api("/api/v1/liff/hospitals");
      var hit = hospitals.filter(function (h) { return h.id === data.preferred_hospital_id; })[0];
      if (hit) data.preferred_hospital_id = hit.name;
    }
    if ((state.completed_steps || []).length) {
      var dl = document.getElementById("summary");
      SUMMARY_KEYS.forEach(function (pair) {
        if (!data[pair[0]]) return;
        var dt = document.createElement("dt"); dt.className = "col-4 text-secondary"; dt.textContent = pair[1];
        var dd = document.createElement("dd"); dd.className = "col-8 mb-1"; dd.textContent = data[pair[0]];
        dl.appendChild(dt); dl.appendChild(dd);
      });
      var dt2 = document.createElement("dt"); dt2.className = "col-4 text-secondary"; dt2.textContent = "完成步驟";
      var dd2 = document.createElement("dd"); dd2.className = "col-8 mb-1"; dd2.textContent = state.completed_steps.length + " / " + state.total_steps;
      dl.appendChild(dt2); dl.appendChild(dd2);
      document.getElementById("summary-card").classList.remove("d-none");
    }
  });
})();
</script>
{% endblock %}
