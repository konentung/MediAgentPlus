<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}MediAgent+{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6f8; font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; }
    .brand { color: #2f6f62; }
    .btn-brand { background: #2f6f62; border-color: #2f6f62; color: #fff; }
    .btn-brand:hover { background: #245648; border-color: #245648; color: #fff; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <main class="container py-3" style="max-width: 640px;">
    <div id="auth-loading" class="text-center py-5">
      <div class="spinner-border text-secondary" role="status"></div>
      <p class="mt-3 text-secondary">正在確認登入狀態…</p>
    </div>
    <div id="auth-error" class="alert alert-danger d-none" role="alert"></div>
    <div id="page" class="d-none">
      {% block content %}{% endblock %}
    </div>
  </main>
  <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3" id="toast-area"></div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // LIFF 共用：liff.init → id_token 換 JWT。只有本機開發（沒設 LIFF_ID）才退回網頁版 LINE Login。
    // 沒有 refresh token：access token 到期時再跑一次 login()（LIFF 內會自動換新 id_token）。
    window.LiffApp = (function () {
      var tokens = { access: null };

      function readStored() {
        try { tokens.access = sessionStorage.getItem("access_token"); } catch (err) { /* 私密瀏覽等情境無法讀取 */ }
      }

      function store(pair) {
        tokens.access = pair.access_token;
        try { sessionStorage.setItem("access_token", pair.access_token); } catch (err) { /* ignore */ }
      }

      // ngrok 免費版會對瀏覽器請求插入警告頁，帶這個 header 可略過；正式環境無害
      var BASE_HEADERS = { "Content-Type": "application/json", Accept: "application/json", "ngrok-skip-browser-warning": "1" };

      async function fetchConfig() {
        var resp = await fetch("/api/v1/liff/config", { headers: BASE_HEADERS });
        return (await resp.json()).data.liff_id;
      }

      async function login() {
        var liffId = await fetchConfig();

        if (!liffId) {
          // 伺服器沒設 LIFF_ID：只有本機開發會走到這裡，退回網頁版 LINE Login
          return webLogin();
        }
        if (!window.liff) throw new Error("LIFF SDK 載入失敗，請確認網路後重新開啟");

        try {
          await liff.init({ liffId: liffId });
        } catch (err) {
          // 在 LIFF 內失敗最常見的原因：.env 的 LIFF_ID 與實際開啟的 LIFF app 不同，
          // 或 LINE Developers Console 的 Endpoint URL 與目前網域不一致
          throw new Error("LIFF 初始化失敗（" + (err && err.message ? err.message : err) + "）。" +
            "請確認伺服器 .env 的 LIFF_ID 為 " + liffId + "，且 LIFF Endpoint URL 指向 " + window.location.origin + "/liff");
        }

        if (!liff.isLoggedIn()) {
          // 外部瀏覽器開 LIFF 連結時尚未登入：用 LIFF 自己的登入，登入後回到本頁
          liff.login({ redirectUri: window.location.href });
          return new Promise(function () {});
        }

        // LIFF SDK 會快取 id_token，LINE 的 id_token 只有效約 1 小時；過期就先登出再重新取得，
        // 否則伺服器會回「IdToken expired」。RELOGIN_FLAG 避免無限重載。
        var decoded = null;
        try { decoded = liff.getDecodedIDToken(); } catch (err) { /* 沒有 id_token */ }
        if (decoded && decoded.exp && decoded.exp * 1000 < Date.now() + 60 * 1000) {
          return relogin("id_token 已過期");
        }

        var idToken = liff.getIDToken();
        var accessToken = liff.getAccessToken();
        try {
          if (idToken) return await exchangeToken({ id_token: idToken });
          if (accessToken) return await exchangeToken({ access_token: accessToken });
        } catch (err) {
          // 伺服器判定 token 無效（過期、被撤銷）：重新登入一次
          if (err.status === 401) return relogin(err.message);
          throw err;
        }
        throw new Error("無法取得 LINE 登入資訊，請在 LINE Developers Console 的 LIFF 設定勾選 openid 與 profile scope 後重新開啟");
      }

      var RELOGIN_FLAG = "liff_relogin_attempted";

      function relogin(reason) {
        var attempted = false;
        try { attempted = sessionStorage.getItem(RELOGIN_FLAG) === "1"; } catch (err) { /* ignore */ }
        if (attempted) {
          try { sessionStorage.removeItem(RELOGIN_FLAG); } catch (err) { /* ignore */ }
          throw new Error("重新登入後仍無法驗證（" + reason + "），請關閉這個視窗後從 LINE 重新開啟");
        }
        try { sessionStorage.setItem(RELOGIN_FLAG, "1"); } catch (err) { /* ignore */ }
        liff.logout();
        if (liff.isInClient()) {
          // LINE 內建瀏覽器：重新載入後 liff.init 會自動重新登入並取得新 token
          window.location.reload();
        } else {
          liff.login({ redirectUri: window.location.href });
        }
        return new Promise(function () {});
      }

      async function exchangeToken(body) {
        var resp = await fetch("/api/v1/liff/auth", { method: "POST", headers: BASE_HEADERS, body: JSON.stringify(body) });
        var data = await resp.json();
        if (!resp.ok) {
          var error = new Error(data.error ? data.error.message : "登入失敗");
          error.status = resp.status;
          throw error;
        }
        try { sessionStorage.removeItem(RELOGIN_FLAG); } catch (err) { /* ignore */ }
        store(data.data.tokens);
        return data.data.principal;
      }

      async function webLogin() {
        readStored();
        if (tokens.access) {
          var me = await api("/api/v1/liff/me");
          return me.principal;
        }
        var back = window.location.pathname + window.location.search;
        window.location.replace("/api/v1/auth/line/login?redirect_to=" + encodeURIComponent(back));
        return new Promise(function () {});
      }

      async function api(path, options, retried) {
        options = options || {};
        var headers = Object.assign({}, BASE_HEADERS, options.headers || {});
        if (tokens.access) headers.Authorization = "Bearer " + tokens.access;
        var resp = await fetch(path, Object.assign({}, options, {
          headers: headers,
          body: options.body && typeof options.body !== "string" ? JSON.stringify(options.body) : options.body
        }));
        if (resp.status === 401 && !retried) {
          // 登入過期：重新走一次 LIFF 登入換新 token，再重送這個請求
          try { sessionStorage.removeItem("access_token"); } catch (err) { /* ignore */ }
          tokens.access = null;
          await login();
          return api(path, options, true);
        }
        var body = await resp.json();
        if (!resp.ok) {
          var error = new Error(body.error ? body.error.message : "請求失敗");
          error.details = body.error ? body.error.details : null;
          error.status = resp.status;
          throw error;
        }
        return body.data;
      }

      async function boot(pageInit) {
        try {
          var principal = await login();
          document.getElementById("auth-loading").classList.add("d-none");
          document.getElementById("page").classList.remove("d-none");
          await pageInit({ principal: principal, api: api });
        } catch (err) {
          var box = document.getElementById("auth-error");
          document.getElementById("auth-loading").classList.add("d-none");
          box.textContent = err.message || "發生錯誤，請稍後再試";
          box.classList.remove("d-none");
        }
      }

      // 短暫提示（例如「草稿已儲存」），不佔版面，兩秒後自動消失
      function toast(message, kind) {
        var node = document.createElement("div");
        node.className = "toast align-items-center text-bg-" + (kind || "dark") + " border-0";
        node.setAttribute("role", "status");
        var body = document.createElement("div");
        body.className = "toast-body text-center";
        body.textContent = message;
        node.appendChild(body);
        document.getElementById("toast-area").appendChild(node);
        var t = new bootstrap.Toast(node, { delay: 2000 });
        node.addEventListener("hidden.bs.toast", function () { node.remove(); });
        t.show();
      }

      return { boot: boot, api: api, toast: toast };
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
