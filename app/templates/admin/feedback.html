{% extends "admin/base.html" %}
{% block title %}意見回饋{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3">
  <h1 class="h4 mb-0">意見回饋</h1>
  <div class="d-flex gap-2">
    <select class="form-select form-select-sm" id="status-filter" style="width: auto;">
      <option value="open">待處理</option>
      <option value="resolved">已處理</option>
      <option value="">全部</option>
    </select>
    <button class="btn btn-outline-secondary btn-sm" id="btn-reload">重新整理</button>
  </div>
</div>
<p class="small text-secondary">使用者從 LINE「意見回饋」表單送出。只看得到本院病人（已確認就醫院所）與本院人員的回饋；沒有院所的回饋由系統管理員處理。</p>
<div class="card">
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light"><tr><th style="width: 140px;">時間</th><th style="width: 100px;">類別</th><th>內容</th><th style="width: 160px;">使用者 / 聯絡方式</th><th style="width: 90px;">狀態</th><th style="width: 130px;"></th></tr></thead>
      <tbody id="rows"><tr><td colspan="6" class="text-center text-secondary py-4">載入中…</td></tr></tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
Admin.boot(async function (ctx) {
  async function load() {
    var tbody = document.getElementById("rows");
    var status = document.getElementById("status-filter").value;
    var items = await ctx.api("/api/v1/admin/feedback" + (status ? "?status=" + status : ""));
    if (!items.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-secondary py-4">沒有回饋</td></tr>';
      return;
    }
    tbody.innerHTML = items.map(function (f) {
      var who = (f.display_name ? Admin.esc(f.display_name) : "<span class='text-secondary'>匿名</span>") +
        (f.user_id ? " <a href='/admin/patients/" + Admin.esc(f.user_id) + "' class='small'>檢視</a>" : "") +
        (f.contact ? "<div class='small text-secondary'>" + Admin.esc(f.contact) + "</div>" : "");
      var badge = f.status === "open" ? "text-bg-warning" : "text-bg-success";
      var action = f.status === "open"
        ? '<button class="btn btn-sm btn-brand" data-resolve="' + f.id + '">標記已處理</button>'
        : '<div class="small text-secondary">' + Admin.esc(f.resolver_note || "") + '</div><button class="btn btn-sm btn-link p-0" data-reopen="' + f.id + '">重新開啟</button>';
      return "<tr><td class='small text-secondary'>" + Admin.fmtDate(f.created_at) + "</td>" +
        "<td>" + Admin.esc(Admin.label("feedback_categories", f.category)) + "</td>" +
        "<td style='white-space: pre-wrap;'>" + Admin.esc(f.content) + "</td>" +
        "<td>" + who + "</td>" +
        "<td><span class='badge " + badge + "'>" + Admin.esc(Admin.label("feedback_statuses", f.status)) + "</span></td>" +
        "<td class='text-end'>" + action + "</td></tr>";
    }).join("");
    tbody.querySelectorAll("[data-resolve]").forEach(function (b) {
      b.addEventListener("click", async function () {
        var note = window.prompt("處理備註（選填）", "");
        if (note === null) return;
        try {
          await ctx.api("/api/v1/admin/feedback/" + b.getAttribute("data-resolve"), { method: "PATCH", body: { status: "resolved", note: note } });
          Admin.toast("已標記處理");
          await load();
        } catch (err) { Admin.toast(err.message, "danger"); }
      });
    });
    tbody.querySelectorAll("[data-reopen]").forEach(function (b) {
      b.addEventListener("click", async function () {
        try {
          await ctx.api("/api/v1/admin/feedback/" + b.getAttribute("data-reopen"), { method: "PATCH", body: { status: "open" } });
          await load();
        } catch (err) { Admin.toast(err.message, "danger"); }
      });
    });
  }
  document.getElementById("btn-reload").addEventListener("click", load);
  document.getElementById("status-filter").addEventListener("change", load);
  await load();
});
</script>
{% endblock %}
