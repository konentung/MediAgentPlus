{% extends "admin/base.html" %}
{% block title %}人員與角色{% endblock %}

{% block head %}
<style>
  /* 欄寬固定：不隨內容（長院所名稱、指派表單）改變；長文字截斷、滑鼠移上去看全文 */
  #staff-table { table-layout: fixed; min-width: 960px; }
  #staff-table th { white-space: nowrap; }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">人員與角色</h1>
  <span class="small text-secondary" id="table-stats">—</span>
</div>
<div class="card mb-3">
  <div class="card-body">
    <form class="row g-2 mb-3" id="filter-form" role="search">
      <div class="col-md-7"><input class="form-control" type="search" name="q" placeholder="關鍵字：顯示名稱 / 使用者 ID" aria-label="關鍵字"></div>
      <div class="col-md-3 d-flex align-items-center">
        <div class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" id="all-users" name="all">
          <label class="form-check-label small" for="all-users">含一般使用者</label>
        </div>
      </div>
      <div class="col-md-2 d-flex gap-2">
        <button class="btn btn-outline-secondary flex-fill text-nowrap" type="submit">搜尋</button>
        <button class="btn btn-outline-secondary flex-fill text-nowrap" type="reset">清除</button>
      </div>
    </form>
    <div class="table-responsive">
      <table class="table table-sm table-hover align-middle mb-0" id="staff-table">
        <colgroup>
          <col style="width: 10%"><col style="width: 22%"><col style="width: 13%"><col style="width: 18%"><col style="width: 8%"><col style="width: 29%">
        </colgroup>
        <thead class="table-light"><tr><th>顯示名稱</th><th>使用者 ID</th><th>角色</th><th>所屬單位</th><th>綁定狀態</th><th>指派角色</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="small text-secondary mt-3 mb-0 d-none" id="table-empty">沒有符合的使用者。</p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
Admin.boot(async function (ctx) {
  // 可指派的角色由後端 rbac.assignable_roles() 決定（/api/v1/auth/me 回傳）：
  // 院所管理員只會拿到院所的角色，藥局管理員只會拿到藥局人員
  var ASSIGNABLE = ctx.me.assignable_roles || [];
  var isSuper = ctx.me.role === "super_admin";

  var filterForm = document.getElementById("filter-form");
  function reload() { load().catch(function (err) { Admin.toast(err.message, "danger"); }); }

  async function load() {
    var q = filterForm.elements.q.value.trim();
    var all = filterForm.elements.all.checked;
    var users = await ctx.api("/api/v1/admin/users?q=" + encodeURIComponent(q) + "&staff=" + (all ? "0" : "1"));
    var tbody = document.getElementById("rows");
    document.getElementById("table-stats").textContent = "共 " + users.length + " 筆";
    document.getElementById("table-empty").classList.toggle("d-none", users.length > 0);
    tbody.innerHTML = users.map(function (u) {
      // 目標的角色不在可指派範圍（例如院所管理員看到系統管理員）或是自己：不顯示指派表單
      var editable = ASSIGNABLE.indexOf(u.role) >= 0 && u.user_id !== ctx.me.user_id;
      var options = ASSIGNABLE.map(function (r) { return '<option value="' + r + '"' + (r === u.role ? " selected" : "") + ">" + Admin.esc(Admin.label("roles", r)) + "</option>"; }).join("");
      var assign = !editable ? '<span class="small text-secondary">' + (u.user_id === ctx.me.user_id ? "不能修改自己的角色" : "無法指派") + "</span>" :
        '<form class="d-flex gap-2 align-items-center" data-user="' + Admin.esc(u.user_id) + '" novalidate><select class="form-select form-select-sm flex-fill" name="role" aria-label="角色">' + options + "</select>" +
        // 單位管理員不用選單位（一律是自己的院所 / 藥局）；系統管理員依角色填院所或藥局代碼
        (isSuper ? '<input class="form-control form-control-sm flex-fill" data-hospital-picker data-current="' + Admin.esc(u.hospital_id || "") + '" data-current-name="' + Admin.esc(u.hospital_name || "") + '" placeholder="院所名稱或代碼（留空 = 不指派）" aria-label="院所"><input type="hidden" name="hospital_id">' +
          '<input class="form-control form-control-sm flex-fill" data-pharmacy-picker data-current="' + Admin.esc(u.pharmacy_id || "") + '" data-current-name="' + Admin.esc(u.pharmacy_name || "") + '" placeholder="藥局名稱或代碼" aria-label="藥局"><input type="hidden" name="pharmacy_id">' : "") +
        '<button class="btn btn-sm btn-brand flex-shrink-0" type="submit">儲存</button></form>';
      var hospital = u.pharmacy_id ? "藥局：" + (u.pharmacy_name || u.pharmacy_id) : (u.hospital_name || Admin.hospitalName(u.hospital_id));
      return "<tr><td class='text-truncate' title='" + Admin.esc(u.display_name || "") + "'>" + Admin.esc(u.display_name || "—") + "</td>" +
        "<td class='small text-secondary text-truncate' title='" + Admin.esc(u.user_id) + "'>" + Admin.esc(u.user_id) + "</td>" +
        "<td class='text-truncate'>" + Admin.esc(Admin.label("roles", u.role)) + "</td>" +
        "<td class='text-truncate' title='" + Admin.esc(hospital) + "'>" + Admin.esc(hospital) + "</td>" +
        "<td>" + Admin.esc(Admin.label("binding_statuses", u.binding_status)) + "</td><td>" + assign + "</td></tr>";
    }).join("");
    tbody.querySelectorAll("form[data-user]").forEach(function (form) {
      var input = form.querySelector("[data-hospital-picker]"), picker = null;
      if (input) {
        picker = Admin.hospitalPicker(input, form.elements.hospital_id);
        picker.set(input.getAttribute("data-current"), input.getAttribute("data-current-name"));
      }
      var pharmacyInput = form.querySelector("[data-pharmacy-picker]"), pharmacyPicker = null;
      if (pharmacyInput) {
        pharmacyPicker = Admin.pharmacyPicker(pharmacyInput, form.elements.pharmacy_id);
        pharmacyPicker.set(pharmacyInput.getAttribute("data-current"), pharmacyInput.getAttribute("data-current-name"));
      }
      // 系統管理員：依選的角色只留用得到的單位欄位（藥局人員 → 藥局、院所角色 → 院所、單位管理員兩者擇一）
      function syncOrgInputs() {
        if (!pharmacyInput) return;
        var role = form.elements.role.value;
        var needPharmacy = role === "pharmacy_staff" || role === "hospital_admin";
        var needHospital = role !== "pharmacy_staff";
        pharmacyInput.classList.toggle("d-none", !needPharmacy);
        input.classList.toggle("d-none", !needHospital);
      }
      form.elements.role.addEventListener("change", syncOrgInputs);
      syncOrgInputs();
      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        if (pharmacyPicker && pharmacyInput.classList.contains("d-none")) pharmacyPicker.set("");
        if (pharmacyPicker && !pharmacyPicker.validate()) { Admin.toast("找不到這家藥局，請從清單挑選或輸入藥局代碼", "warning"); return; }
        if (pharmacyPicker && form.elements.pharmacy_id.value && form.elements.role.value === "hospital_admin") picker.set("");  // 藥局管理員不掛院所
        if (picker && !picker.validate()) { Admin.toast("找不到這家院所，請從清單挑選或輸入院所代碼", "warning"); return; }
        try {
          await ctx.api("/api/v1/admin/users/" + form.getAttribute("data-user") + "/role", { method: "PUT", body: Admin.formData(form) });
          Admin.toast("已更新角色");
          await load();
        } catch (err) { Admin.toast(err.message, "danger"); }
      });
    });
  }
  filterForm.addEventListener("submit", function (e) { e.preventDefault(); reload(); });
  // reset 事件在欄位清空前觸發，等清空後再重新載入
  filterForm.addEventListener("reset", function () { setTimeout(reload, 0); });
  await load();
});
</script>
{% endblock %}
