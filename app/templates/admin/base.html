<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}後台{% endblock %} - MediAgent+</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6f8; font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; }
    .sidebar { background: #1f3d36; min-height: 100vh; }
    .sidebar .nav-link { color: rgba(255,255,255,.75); border-radius: .5rem; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,.12); }
    .brand { color: #2f6f62; }
    .btn-brand { background: #2f6f62; border-color: #2f6f62; color: #fff; }
    .btn-brand:hover { background: #245648; border-color: #245648; color: #fff; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<div id="gate" class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  <div class="text-center">
    <div class="spinner-border text-secondary" role="status"></div>
    <p class="mt-3 text-secondary">正在確認登入狀態…</p>
  </div>
</div>

<div id="shell" class="container-fluid d-none">
  <div class="row">
    <nav class="col-md-3 col-lg-2 sidebar p-3 d-flex flex-column" aria-label="後台選單">
      <a class="text-white text-decoration-none fw-bold fs-5 mb-3 d-block" href="{{ url_for('admin_pages.dashboard') }}">MediAgent+ 後台</a>
      <ul class="nav nav-pills flex-column gap-1">
        <li class="nav-item"><a class="nav-link {{ 'active' if active == 'dashboard' }}" href="{{ url_for('admin_pages.dashboard') }}">儀表板</a></li>
        <li class="nav-item" data-perm="patient:read"><a class="nav-link {{ 'active' if active == 'patients' }}" href="{{ url_for('admin_pages.patients') }}">病人資料</a></li>
        <li class="nav-item" data-perm="feedback:manage"><a class="nav-link {{ 'active' if active == 'feedback' }}" href="{{ url_for('admin_pages.feedback') }}">意見回饋</a></li>
        <li class="nav-item" data-perm="staff:manage"><a class="nav-link {{ 'active' if active == 'staff' }}" href="{{ url_for('admin_pages.staff') }}">人員與角色</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if active == 'knowledge' }}" href="{{ url_for('admin_pages.knowledge') }}">AI 知識庫</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if active == 'pharmacies' }}" href="{{ url_for('admin_pages.pharmacies') }}">藥局</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if active == 'drugs' }}" href="{{ url_for('admin_pages.drugs') }}">藥品</a></li>
        <li class="nav-item" data-perm="hospital:settings"><a class="nav-link {{ 'active' if active == 'settings' }}" href="{{ url_for('admin_pages.settings') }}">院所設定</a></li>
        <li class="nav-item" data-perm="audit:read"><a class="nav-link {{ 'active' if active == 'audit' }}" href="{{ url_for('admin_pages.audit') }}">稽核紀錄</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if active == 'permissions' }}" href="{{ url_for('admin_pages.permissions') }}">權限矩陣</a></li>
      </ul>
      <div class="mt-auto pt-3 border-top border-light border-opacity-25 small text-white-50">
        <div id="me-name" class="text-white"></div>
        <div id="me-role"></div>
        <div id="me-hospital"></div>
        <a href="#" id="logout" class="text-white-50 d-inline-block mt-2">登出</a>
      </div>
    </nav>
    <main class="col-md-9 col-lg-10 p-4">
      <div id="toast-area" class="toast-container position-fixed top-0 end-0 p-3"></div>
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<script id="admin-choices" type="application/json">{{ admin_choices_json | safe }}</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // 後台共用：sessionStorage 內的 JWT → /api/v1/auth/me → 依權限顯示選單；資料請求都帶 Bearer。
  // 沒有 refresh token：access token 到期（院方預設 8 小時）就導回登入頁重新登入。
  window.Admin = (function () {
    var CHOICES = JSON.parse(document.getElementById("admin-choices").textContent);
    var tokens = { access: null };
    var me = null;
    var hospitals = {};  // id → 院所物件，boot 時載入

    function readTokens() {
      try { tokens.access = sessionStorage.getItem("access_token"); } catch (err) { /* ignore */ }
    }

    // 導到後台登入頁：帶上目前頁面（登入後回來）與原因（顯示提示）。登出 = 清掉本機 token
    function toLogin(reason) {
      try { sessionStorage.clear(); } catch (err) { /* ignore */ }
      var next = window.location.pathname + window.location.search;
      var url = "{{ url_for('admin_pages.login') }}?next=" + encodeURIComponent(next);
      if (reason) url += "&error=" + reason;
      window.location.replace(url);
    }

    async function api(path, options) {
      options = options || {};
      var headers = Object.assign({ "Content-Type": "application/json", Accept: "application/json", "ngrok-skip-browser-warning": "1" }, options.headers || {});
      if (tokens.access) headers.Authorization = "Bearer " + tokens.access;
      var resp = await fetch(path, Object.assign({}, options, {
        headers: headers,
        body: options.body && typeof options.body !== "string" ? JSON.stringify(options.body) : options.body
      }));
      if (resp.status === 401) {
        toLogin("expired");
        return new Promise(function () {});
      }
      var body = await resp.json();
      if (!resp.ok) {
        var error = new Error(body.error ? body.error.message : "請求失敗");
        error.details = body.error ? body.error.details : null;
        error.status = resp.status;
        throw error;
      }
      return body.data;
    }

    // multipart 上傳（CSV / 衛教 txt）：用 XHR 才拿得到上傳進度；onProgress(percent) 可省略。
    // 大檔（例如 96MB 的健保用藥）經 ngrok 上傳會很慢，沒有進度使用者會以為當掉。
    function upload(path, file, onProgress, fields) {
      // file 可以是單一 File（欄位 file）或 File 陣列（欄位 files，多檔一次上傳）
      return new Promise(function (resolve, reject) {
        var data = new FormData();
        if (Array.isArray(file)) file.forEach(function (f) { data.append("files", f); });
        else data.append("file", file);
        Object.keys(fields || {}).forEach(function (key) { data.append(key, fields[key]); });
        var xhr = new XMLHttpRequest();
        xhr.open("POST", path);
        xhr.setRequestHeader("Authorization", "Bearer " + tokens.access);
        xhr.setRequestHeader("Accept", "application/json");
        xhr.setRequestHeader("ngrok-skip-browser-warning", "1");
        xhr.upload.onprogress = function (e) {
          if (onProgress && e.lengthComputable) onProgress(Math.round(e.loaded * 100 / e.total));
        };
        xhr.onerror = function () { reject(new Error("連線中斷，檔案沒有送達伺服器")); };
        xhr.onload = function () {
          if (xhr.status === 401) { toLogin("expired"); return; }
          var body = null;
          try { body = JSON.parse(xhr.responseText); } catch (err) { /* 不是 JSON（例如 proxy 的錯誤頁） */ }
          if (xhr.status >= 200 && xhr.status < 300 && body) { resolve(body.data); return; }
          reject(new Error(body && body.error ? body.error.message : "上傳失敗（HTTP " + xhr.status + "）"));
        };
        xhr.send(data);
      });
    }

    // 表格分頁：把 API 回的 {page, pages, total, per_page} 畫成 Bootstrap pagination，點頁碼呼叫 onPage(page)
    function pagination(container, data, onPage) {
      container.innerHTML = "";
      if (!data.total) return;
      var first = (data.page - 1) * data.per_page + 1, last = Math.min(data.page * data.per_page, data.total);
      var info = document.createElement("div");
      info.className = "small text-secondary";
      info.textContent = "第 " + first + "–" + last + " 筆，共 " + data.total + " 筆（" + data.page + " / " + data.pages + " 頁）";
      var ul = document.createElement("ul");
      ul.className = "pagination pagination-sm mb-0";
      function item(label, page, disabled, active) {
        var li = document.createElement("li");
        li.className = "page-item" + (disabled ? " disabled" : "") + (active ? " active" : "");
        var a = document.createElement("a");
        a.className = "page-link"; a.href = "#"; a.textContent = label;
        a.addEventListener("click", function (e) { e.preventDefault(); if (!disabled && !active) onPage(page); });
        li.appendChild(a); ul.appendChild(li);
      }
      item("上一頁", data.page - 1, data.page <= 1, false);
      // 目前頁前後各 2 頁，加頭尾
      var start = Math.max(1, data.page - 2), end = Math.min(data.pages, data.page + 2);
      if (start > 1) { item("1", 1, false, false); if (start > 2) item("…", 0, true, false); }
      for (var p = start; p <= end; p++) item(String(p), p, false, p === data.page);
      if (end < data.pages) { if (end < data.pages - 1) item("…", 0, true, false); item(String(data.pages), data.pages, false, false); }
      item("下一頁", data.page + 1, data.page >= data.pages, false);
      container.className = "d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3";
      container.appendChild(info); container.appendChild(ul);
    }

    function can(permission) { return me && me.permissions.indexOf(permission) >= 0; }

    function label(group, value) {
      return (CHOICES[group] && CHOICES[group][value]) || value || "—";
    }

    function hospitalName(id) {
      return id ? (hospitals[id] ? hospitals[id].name : id) : "—";
    }

    // 把院所清單塞進 <select>
    function hospitalOptions(select, includeEmpty, emptyLabel) {
      select.innerHTML = includeEmpty ? '<option value="">' + esc(emptyLabel || "請選擇院所") + "</option>" : "";
      Object.keys(hospitals).forEach(function (id) {
        var opt = document.createElement("option");
        opt.value = id; opt.textContent = hospitals[id].name + "（" + id + "）";
        select.appendChild(opt);
      });
    }

    function esc(text) {
      return String(text == null ? "" : text).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function fmtDate(value) {
      if (!value) return "—";
      var d = new Date(value);
      return isNaN(d) ? value : d.toLocaleString("zh-TW", { hour12: false });
    }

    function toast(message, kind) {
      var area = document.getElementById("toast-area");
      var node = document.createElement("div");
      node.className = "toast align-items-center text-bg-" + (kind || "success") + " border-0";
      node.setAttribute("role", "status");
      node.innerHTML = '<div class="d-flex"><div class="toast-body">' + esc(message) + '</div>' +
        '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="關閉"></button></div>';
      area.appendChild(node);
      var t = new bootstrap.Toast(node, { delay: 3500 });
      node.addEventListener("hidden.bs.toast", function () { node.remove(); });
      t.show();
    }

    // 從 form 收集成物件：空字串 → null，checkbox → boolean
    function formData(form) {
      var out = {};
      Array.prototype.forEach.call(form.elements, function (input) {
        if (!input.name) return;
        if (input.type === "checkbox") out[input.name] = input.checked;
        else out[input.name] = input.value.trim() === "" ? null : input.value.trim();
      });
      return out;
    }

    function options(select, group, includeEmpty) {
      select.innerHTML = includeEmpty ? '<option value="">請選擇</option>' : "";
      Object.keys(CHOICES[group]).forEach(function (value) {
        var opt = document.createElement("option");
        opt.value = value; opt.textContent = CHOICES[group][value];
        select.appendChild(opt);
      });
    }

    async function boot(pageInit) {
      readTokens();
      if (!tokens.access) { toLogin("unauthorized"); return; }
      try {
        me = await api("/api/v1/auth/me");
      } catch (err) { toLogin("expired"); return; }
      // 不是院方人員就不進後台，也不顯示登入頁，直接回首頁
      if (!me.is_staff) { window.location.replace({{ url_for("pages.home") | tojson }}); return; }
      document.getElementById("gate").classList.add("d-none");
      document.querySelectorAll("[data-perm]").forEach(function (item) {
        if (!can(item.getAttribute("data-perm"))) item.classList.add("d-none");
      });
      try {
        // 只載入醫院層級（約幾百家）供下拉選單與名稱顯示；診所有上萬家，不在這裡載
        (await api("/api/v1/admin/hospitals/options")).forEach(function (h) { hospitals[h.id] = h; });
      } catch (err) { /* 院所清單載不到不影響其他頁面 */ }
      document.getElementById("me-name").textContent = me.display_name || me.user_id;
      document.getElementById("me-role").textContent = label("roles", me.role);
      document.getElementById("me-hospital").textContent = me.hospital_id ? "院所：" + hospitalName(me.hospital_id) : (me.role === "super_admin" ? "全部院所" : "尚未指派院所");
      document.getElementById("logout").addEventListener("click", function (e) { e.preventDefault(); toLogin(); });
      document.getElementById("shell").classList.remove("d-none");
      try {
        await pageInit({ me: me, api: api, can: can, hospitals: hospitals });
      } catch (err) {
        toast(err.message || "載入失敗", "danger");
      }
    }

    return { boot: boot, api: api, upload: upload, pagination: pagination, can: can, label: label, esc: esc, fmtDate: fmtDate, toast: toast, formData: formData, options: options, choices: CHOICES, hospitalName: hospitalName, hospitalOptions: hospitalOptions };
  })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
