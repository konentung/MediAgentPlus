{% extends "admin/base.html" %}
{% block title %}病人資料{% endblock %}

{% block content %}
<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
  <h1 class="h4 mb-0">病人資料</h1>
  <form class="d-flex gap-2" id="search-form" role="search">
    <input class="form-control" type="search" name="q" placeholder="姓名 / 手機 / 身分證末四碼 / 病歷號" style="min-width: 280px;">
    <button class="btn btn-outline-secondary" type="submit">搜尋</button>
  </form>
</div>

<ul class="nav nav-tabs mb-3" id="status-tabs" role="tablist">
  <li class="nav-item"><a class="nav-link" href="#" data-status="pending">待核對</a></li>
  <li class="nav-item"><a class="nav-link" href="#" data-status="active">已建檔</a></li>
  <li class="nav-item"><a class="nav-link" href="#" data-status="locked">已鎖定</a></li>
  <li class="nav-item"><a class="nav-link" href="#" data-status="all">全部</a></li>
</ul>

<div class="card border-0 shadow-sm">
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr><th>姓名</th><th>身分證末四碼</th><th>出生日期</th><th>手機</th><th>填表人</th><th>常去院所</th><th>病歷號</th><th>狀態</th><th>送出時間</th><th></th></tr>
      </thead>
      <tbody id="rows"><tr><td colspan="10" class="text-center text-secondary py-4">載入中…</td></tr></tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
Admin.boot(async function (ctx) {
  var params = new URLSearchParams(window.location.search);
  var state = { status: params.get("status") || "pending", q: params.get("q") || "" };
  var tabs = document.querySelectorAll("#status-tabs [data-status]");
  var searchInput = document.querySelector('#search-form input[name="q"]');
  searchInput.value = state.q;

  var BADGE = { pending: "text-bg-warning", verified: "text-bg-success", locked: "text-bg-danger", unbound: "text-bg-secondary" };

  async function load() {
    tabs.forEach(function (t) { t.classList.toggle("active", t.getAttribute("data-status") === state.status); });
    history.replaceState(null, "", "?status=" + state.status + (state.q ? "&q=" + encodeURIComponent(state.q) : ""));
    var tbody = document.getElementById("rows");
    tbody.innerHTML = '<tr><td colspan="10" class="text-center text-secondary py-4">載入中…</td></tr>';
    var rows = await ctx.api("/api/v1/admin/patients?status=" + state.status + "&q=" + encodeURIComponent(state.q));
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="10" class="text-center text-secondary py-4">沒有符合條件的病人</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(function (p) {
      return "<tr>" +
        "<td class='fw-semibold'>" + Admin.esc(p.full_name) + "</td>" +
        "<td>****" + Admin.esc(p.national_id_last4) + "</td>" +
        "<td>" + Admin.esc(p.birth_date) + "</td>" +
        "<td>" + Admin.esc(p.phone) + "</td>" +
        "<td>" + (p.filler_relation === "family" ? "家屬代填" : "本人") + "</td>" +
        "<td>" + Admin.esc(p.preferred_hospital_name || Admin.hospitalName(p.preferred_hospital_id)) + "</td>" +
        "<td>" + Admin.esc(p.medical_record_no || "—") + "</td>" +
        '<td><span class="badge ' + (BADGE[p.binding_status] || "text-bg-secondary") + '">' + Admin.esc(Admin.label("binding_statuses", p.binding_status)) + "</span></td>" +
        "<td class='small text-secondary'>" + Admin.fmtDate(p.submitted_at) + "</td>" +
        '<td class="text-end"><a class="btn btn-sm btn-outline-secondary" href="/admin/patients/' + encodeURIComponent(p.user_id) + '">檢視</a></td>' +
        "</tr>";
    }).join("");
  }

  tabs.forEach(function (t) {
    t.addEventListener("click", function (e) { e.preventDefault(); state.status = t.getAttribute("data-status"); load(); });
  });
  document.getElementById("search-form").addEventListener("submit", function (e) {
    e.preventDefault(); state.q = searchInput.value.trim(); load();
  });
  await load();
});
</script>
{% endblock %}
